name: DSH memory bug
description: Report a reproducible problem with the native DSH memory Bundle
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the exact steps, memory scope, and tool or settings action involved.
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Memory package version and source revision
      placeholder: "0.1.0-alpha.1; commit or tarball SHA-256"
    validations:
      required: true
  - type: input
    id: dsh_version
    attributes:
      label: DSH version
      placeholder: "0.1.5-rc.2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture, Node, and Bun versions
      placeholder: "macOS arm64; Node 24; Bun 1.3.5"
  - type: dropdown
    id: surface
    attributes:
      label: DSH surface
      options:
        - Web settings
        - Headless agent
        - TUI agent
        - Build or isolated package installation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant configuration, errors, and evidence
      description: Include relevant Bundle overrides or test output. Exclude credentials and private memory or Session content.
      render: text
