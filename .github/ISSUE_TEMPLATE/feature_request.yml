name: DSH memory improvement
description: Propose an improvement to the DSH memory project
labels: ["feature request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User task and current limitation
      description: Describe the task, the current behavior, and a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance
      description: Explain the desired result and how to verify it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Memory storage and scope
        - Recall and Session replay
        - Native tools
        - DSH Web settings
        - Build, installation, or documentation
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Resource or compatibility considerations
      description: Describe expected model calls, retained memory, host requirements, or migration needs if applicable.
